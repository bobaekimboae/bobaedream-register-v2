<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보배드림 매물등록 V2</title>
    <link rel="stylesheet" href="./styles.css?v=iconasset1" />
  </head>
  <body>
    <main class="prototype-shell">
      <section class="phone-frame" aria-label="보배드림 매물등록 V2 모바일 시안">
        <div class="status-bar">
          <span class="status-time">1:58</span>
          <span class="status-icons">
            <span class="signal-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="wifi-mark" aria-hidden="true"></span>
            <span class="battery-mark" aria-hidden="true"><i></i></span>
            <span class="battery-text">44%</span>
          </span>
        </div>

        <div class="screen" id="screenRoot"></div>

        <div class="home-indicator" aria-hidden="true"></div>
      </section>

      <aside class="notes-panel" hidden>
        <p class="eyebrow">Bobaedream Register V2</p>
        <h1>사진/영상 등록 기능 시안</h1>
        <p>
          58동청 매물등록에서 확인한 촬영 규칙, 슬롯 이동, 메인 썸네일 드래그,
          삭제/미리보기/영상 단계 흐름을 보배드림 등록 UX로 옮긴 작동형 시안입니다.
        </p>
        <div class="note-list">
          <span>사진 슬롯 30장</span>
          <span>메인 썸네일 순서 이동</span>
          <span>사진 미리보기/편집</span>
          <span>영상 4단계 촬영</span>
          <span>촬영 규칙/검증 가이드</span>
        </div>
      </aside>
    </main>

    <script src="./app.js?v=albumnav1"></script>
  </body>
</html>
